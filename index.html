  <body>
    <noscript><p style="font:18px system-ui;color:#eef0ff;text-align:center;padding:40px 20px">Beamfold is a puzzle game and needs JavaScript turned on to play.</p></noscript>

    <div id="app">
      <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
      <section class="screen" id="home" aria-label="Home"></section>
      <section class="screen" id="levels" aria-label="Journey levels"></section>
      <section class="screen" id="game" aria-label="Puzzle">
        <header class="bar">
          <button class="icon-btn" data-act="back" aria-label="Back"></button>
          <div class="bar-title"><strong id="g-title"></strong><span id="g-sub"></span></div>
          <div class="taps" aria-live="polite"><b id="g-taps">0</b><span id="g-par"></span></div>
        </header>
        <div class="pips" id="g-pips" aria-label="Crystals lit"></div>
        <div class="board-wrap" id="board-wrap"><canvas id="board" aria-label="Puzzle board"></canvas></div>
        <p class="coach" id="g-coach"></p>
        <footer class="tools">
          <button class="tool" data-act="undo" id="t-undo"></button>
          <button class="tool" data-act="restart" id="t-restart"></button>
          <button class="tool" data-act="hint" id="t-hint"></button>
        </footer>
      </section>
      <div class="sheet" id="sheet" hidden></div>
      <div class="modal" id="modal" hidden></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </body>
