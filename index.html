<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beamfold: a light-bending puzzle game</title>
<meta name="description" content="Beamfold is a calm, clever puzzle game for Android. Bend beams of light with mirrors, blend colours and wake every crystal.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background:
    radial-gradient(60% 40% at 15% 0%, rgba(77,163,255,.3), transparent),
    radial-gradient(55% 40% at 100% 45%, rgba(238,125,255,.2), transparent), #0a0c1b;
    color: #e6e8fb; font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; padding: 48px 24px; text-align: center; }
  svg { width: 132px; height: auto; }
  h1 { font-size: 52px; line-height: 1; margin: 12px 0 10px; letter-spacing: -0.02em;
    background: linear-gradient(92deg, #ff7a93, #ffd84d 50%, #45e6e0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #b9bee3; margin: 0 0 14px; }
  a { color: #7cc0ff; }
  .muted { color: #8187b1; font-size: 15px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <svg viewBox="60 110 420 330" aria-hidden="true">
    <defs><linearGradient id="g" x1="96" y1="368" x2="416" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a7a"/><stop offset=".5" stop-color="#ffd84d"/><stop offset="1" stop-color="#45e6e0"/></linearGradient></defs>
    <path d="M96 368H288V176H400" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g stroke="#fff" stroke-width="15" stroke-linecap="round"><path d="M250 406l76-76"/><path d="M250 214l76-76"/></g>
    <path d="M416 132l36 44-36 44-36-44z" fill="#eaffff" stroke="#45e6e0" stroke-width="6" stroke-linejoin="round"/>
  </svg>
  <h1>Beamfold</h1>
  <p>Bend the light. Wake the crystals.</p>
  <p>A calm, clever puzzle game for Android. Turn mirrors, blend colours and light every crystal. No ads, no accounts, works offline.</p>
  <p class="muted"><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
