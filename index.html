<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f7">
<title>Beamfold: a daily light puzzle</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>
  // Pick the theme before first paint so the page never flashes the wrong one.
  (function () {
    var t = null;
    try { t = (JSON.parse(localStorage.getItem('beamfold.daily.v1') || '{}')).theme; } catch (e) { /* private mode */ }
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<body>
  <noscript><p style="font:18px system-ui;text-align:center;padding:40px 20px">Beamfold is a puzzle game and needs JavaScript turned on to play.</p></noscript>

<div id="desk">
  <main class="window" id="window">
    <header class="titlebar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="title">
        <h1>Beamfold</h1>
        <p id="subtitle">Daily puzzle</p>
      </div>
      <nav class="toolbar" aria-label="Game menu">
        <button class="tb" data-act="help" title="How to play" aria-label="How to play">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.9 2.5c-.8.5-1.3 1-1.3 2"/><circle cx="12" cy="16.9" r=".6" fill="currentColor"/></svg>
        </button>
        <button class="tb" data-act="stats" title="Statistics" aria-label="Statistics">
          <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        </button>
        <button class="tb" data-act="sound" id="tb-sound" title="Sound" aria-label="Sound" aria-pressed="true"></button>
        <button class="tb" data-act="theme" id="tb-theme" title="Switch appearance" aria-label="Switch between light and dark"></button>
      </nav>
    </header>

    <section class="gauges" aria-label="Progress">
      <div class="gauge">
        <span class="label">Time</span>
        <span class="value" id="g-time">0:00</span>
      </div>
      <div class="gauge">
        <span class="label">Moves</span>
        <span class="value"><span id="g-moves">0</span><small id="g-par"></small></span>
      </div>
      <div class="gauge">
        <span class="label">Crystals</span>
        <span class="pips" id="g-pips"></span>
      </div>
    </section>

    <section class="stage" id="stage">
      <canvas id="board" aria-label="Puzzle board"></canvas>
      <div class="cover" id="cover"></div>
    </section>

    <footer class="actions" id="actions"></footer>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
